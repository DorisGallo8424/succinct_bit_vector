[project]
name = "succinct-bit-vector"
version = "0.1.0"
description = "Bit vector backed by a Python int, with rank and select queries in O(1)."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
